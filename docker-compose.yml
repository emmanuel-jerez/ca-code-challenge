services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-wp}
      MYSQL_USER: ${WORDPRESS_DB_USER:-wp}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp}
      # Read-only user for the Django importer (db/initdb/02-wp-import-user.sh).
      WP_IMPORT_DB_USER: ${WP_IMPORT_DB_USER:-wp_import}
      WP_IMPORT_DB_PASSWORD: ${WP_IMPORT_DB_PASSWORD:-wp_import}
      # Read-only user for the auth service's user import (03-wp-auth-import-user.sh).
      WP_AUTH_IMPORT_DB_USER: ${WP_AUTH_IMPORT_DB_USER:-wp_auth_import}
      WP_AUTH_IMPORT_DB_PASSWORD: ${WP_AUTH_IMPORT_DB_PASSWORD:-wp_auth_import}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/dump.sql:/docker-entrypoint-initdb.d/01-dump.sql:ro
      - ./db/initdb/02-wp-import-user.sh:/docker-entrypoint-initdb.d/02-wp-import-user.sh:ro
      - ./db/initdb/03-wp-auth-import-user.sh:/docker-entrypoint-initdb.d/03-wp-auth-import-user.sh:ro
    # Localhost only, for running the import and its tests from the host.
    ports:
      - "127.0.0.1:${WP_DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6.9-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wp}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wp}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: "1"
    volumes:
      - wp_files:/var/www/html
      - ./wp-content/plugins:/var/www/html/wp-content/plugins
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wp-content/themes/consumer-reviews:/var/www/html/wp-content/themes/consumer-reviews
      - ./wp-content/uploads:/var/www/html/wp-content/uploads
    entrypoint:
      - bash
      - -c
      - |
        mkdir -p /var/www/html/wp-content/themes /var/www/html/wp-content/languages
        cp -rn /usr/src/wordpress/wp-content/themes/. /var/www/html/wp-content/themes/ 2>/dev/null || true
        cp -rn /usr/src/wordpress/wp-content/languages/. /var/www/html/wp-content/languages/ 2>/dev/null || true
        [ -f /var/www/html/wp-content/index.php ] || cp /usr/src/wordpress/wp-content/index.php /var/www/html/wp-content/index.php 2>/dev/null || true
        exec docker-entrypoint.sh apache2-foreground

  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    user: "0:0"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wp}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wp}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp}
      WP_SITE_URL: ${WP_SITE_URL:-http://localhost:8080}
      WP_SITE_TITLE: ${WP_SITE_TITLE:-Brand Reviews Challenge}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-admin}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.com}
    volumes:
      - wp_files:/var/www/html
      - ./wp-content/plugins:/var/www/html/wp-content/plugins
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wp-content/themes/consumer-reviews:/var/www/html/wp-content/themes/consumer-reviews
      - ./wp-content/uploads:/var/www/html/wp-content/uploads
      - ./scripts:/scripts:ro
    entrypoint: ["wp", "--allow-root"]

  phpmyadmin:
    image: phpmyadmin:5
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${WORDPRESS_DB_USER:-wp}
      PMA_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp}
      UPLOAD_LIMIT: 256M

  # Main Django app's own database (ADR 0006). Bound to localhost only, so
  # host-side tests can reach it without exposing it to the network.
  main-db:
    image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MAIN_DB_NAME:-brandreviews}
      POSTGRES_USER: ${MAIN_DB_USER:-brandreviews}
      POSTGRES_PASSWORD: ${MAIN_DB_PASSWORD:-brandreviews}
    volumes:
      - main_db_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${MAIN_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  # Main Django app (Pillar 1). Applies migrations, then serves with gunicorn.
  main-app:
    build: &main-app-build
      context: ./main-app
      # The Dockerfile's Node stage copies the frontend source from here
      # (ADR 0031). Every service that builds this image must pass it:
      # without it, COPY --from=frontend-src would look for an image of
      # that name on Docker Hub.
      additional_contexts:
        frontend-src: ./frontend
    image: brandreviews/main-app:local
    depends_on:
      main-db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment: &main-app-env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-local-dev-key-set-DJANGO_SECRET_KEY-in-env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      MAIN_DB_HOST: main-db
      MAIN_DB_PORT: "5432"
      MAIN_DB_NAME: ${MAIN_DB_NAME:-brandreviews}
      MAIN_DB_USER: ${MAIN_DB_USER:-brandreviews}
      MAIN_DB_PASSWORD: ${MAIN_DB_PASSWORD:-brandreviews}
    command: ["sh", "-c", "python manage.py migrate --noinput && exec gunicorn config.wsgi"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 10
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # One-off WordPress import: `make import`. The only service that gets the
  # WordPress credentials, so the web container can never reach that database.
  wp-import:
    build: *main-app-build
    image: brandreviews/main-app:local
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
      main-db:
        condition: service_healthy
    environment:
      <<: *main-app-env
      WP_IMPORT_DB_HOST: db
      WP_IMPORT_DB_PORT: "3306"
      WP_IMPORT_DB_NAME: ${WORDPRESS_DB_NAME:-wp}
      WP_IMPORT_DB_USER: ${WP_IMPORT_DB_USER:-wp_import}
      WP_IMPORT_DB_PASSWORD: ${WP_IMPORT_DB_PASSWORD:-wp_import}
    command: ["sh", "-c", "python manage.py migrate --noinput && exec python manage.py import_wp"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Auth service (Pillar 5): owns users, passwords and roles, and mints the
  # access tokens. The main app doesn't depend_on it: pages and the listing
  # must work while it's down (ADR 0016).
  auth-service:
    build: &auth-build
      context: ./auth-service
      # The shared library, at the path uv.lock records (ADR 0025). Every
      # service that builds this image must pass it.
      additional_contexts:
        shared-lib: ./shared-lib
    image: brandreviews/auth-service:local
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment: &auth-env
      DJANGO_SECRET_KEY: ${AUTH_DJANGO_SECRET_KEY:-insecure-local-dev-key-set-AUTH_DJANGO_SECRET_KEY-in-env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      # auth-service is the name the main app will use inside the network.
      DJANGO_ALLOWED_HOSTS: ${AUTH_DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,auth-service}
      AUTH_DB_HOST: auth-db
      AUTH_DB_PORT: "5432"
      AUTH_DB_NAME: ${AUTH_DB_NAME:-brandreviews_auth}
      AUTH_DB_USER: ${AUTH_DB_USER:-brandreviews_auth}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-brandreviews_auth}
      JWT_ISSUER: ${JWT_ISSUER:-http://auth-service:8000}
      JWT_SIGNING_KEY_FILE: /run/secrets/jwt_signing_key
    # createcachetable makes the throttle table; it isn't a migration.
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py createcachetable && exec gunicorn config.wsgi"]
    secrets:
      - jwt_signing_key
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # One-off WordPress user import: `make auth-import`. The only auth container
  # with WordPress credentials, and it gets no signing key: it never signs.
  auth-import:
    build: *auth-build
    image: brandreviews/auth-service:local
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
      auth-db:
        condition: service_healthy
    environment:
      <<: *auth-env
      WP_IMPORT_DB_HOST: db
      WP_IMPORT_DB_PORT: "3306"
      WP_IMPORT_DB_NAME: ${WORDPRESS_DB_NAME:-wp}
      WP_IMPORT_DB_USER: ${WP_AUTH_IMPORT_DB_USER:-wp_auth_import}
      WP_IMPORT_DB_PASSWORD: ${WP_AUTH_IMPORT_DB_PASSWORD:-wp_auth_import}
    command: ["sh", "-c", "python manage.py migrate --noinput && exec python manage.py import_wp_users"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # The auth service's own database (ADR 0006). The main app gets no
  # credentials for it. Bound to localhost only, for host-side tests.
  auth-db:
    image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-brandreviews_auth}
      POSTGRES_USER: ${AUTH_DB_USER:-brandreviews_auth}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-brandreviews_auth}
    volumes:
      - auth_db_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${AUTH_DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

# A file secret is a read-only bind mount; Compose ignores uid, gid and mode
# for it, so `make auth-key` makes the file readable by the container's user.
secrets:
  jwt_signing_key:
    file: ./secrets/jwt_ed25519.pem

volumes:
  db_data:
  wp_files:
  main_db_data:
  auth_db_data:
