[project]
name = "brandreviews-main-app"
version = "0.1.0"
description = "Django app that replaces the Brand Reviews WordPress site."
requires-python = ">=3.14,<3.15"
dependencies = [
    # Security floor, not a compatibility floor (ADR 0014).
    "Django>=5.2.18,<5.3",
    # Postgres per service; binary wheel is a deliberate take-home shortcut (ADR 0006).
    "psycopg[binary]>=3.3.6,<3.4",
    # Read-only WordPress import; raise to 1.2.4 once it clears the cooldown (ADR 0007).
    "PyMySQL>=1.2.3,<1.3",
    # WordPress HTML sanitizer (ADR 0004, 0018).
    "nh3>=0.3.7,<0.4",
    # WSGI server for the container (ADR 0008).
    "gunicorn>=26.2.0,<27",
    # JSON-only API; the floor covers all five 2026 advisories (ADR 0015).
    "djangorestframework>=3.18.3,<3.19",
    # Serves theme.css and the <BrandList /> build from the app (ADR 0008, 0031).
    "whitenoise>=6.12.0,<7",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "pytest-django>=4.14.0,<5",
    "mypy>=2.4.1,<2.5",
    "django-stubs[compatible-mypy]>=6.1.2,<6.2",
    "types-PyMySQL>=1.2.0.20260923",
    "ruff>=0.17.3,<0.18",
    "djangorestframework-stubs>=3.18.1,<3.19",
]

[tool.uv]
# Hold back releases younger than 7 days; most malicious releases are pulled
# within days (AGENTS.md, ADR 0012). Never shorten or remove.
exclude-newer = "7 days"
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
addopts = ["--strict-markers", "--import-mode=importlib"]
markers = [
    "wordpress: needs the WordPress MariaDB from docker compose (skipped when unreachable)",
]
filterwarnings = [
    # Keep the Django 6.2 LTS upgrade cheap: fix deprecations where raised.
    "error::django.utils.deprecation.RemovedInDjango60Warning",
    "error::django.utils.deprecation.RemovedInDjango61Warning",
]

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["^\\.venv/"]

[tool.django-stubs]
django_settings_module = "config.settings_test"

[tool.ruff]
target-version = "py314"
line-length = 100
# Generated by makemigrations; reviewed, not hand-formatted.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "S", "TC", "DJ", "PGH", "TID251"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks things.
"**/tests/**" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Django 6.x-only APIs; django-stubs describes 6.x and won't flag them (ADR 0009).
"django.tasks".msg = "Django 6.0+ only; the project targets 5.2 LTS."
"django.middleware.csp".msg = "Django 6.0+ only; use config.csp (ADR 0017)."
"django.utils.csp".msg = "Django 6.0+ only; use config.csp (ADR 0017)."
